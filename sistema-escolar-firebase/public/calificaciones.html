<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Calificaciones - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.95);
            --bg-input: rgba(15, 23, 42, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-warning: #f59e0b;
            --accent-info: #06b6d4;
            --border: #334155;

        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(155deg, var(--bg-primary) 0%, #1a1a2e 100%);
            color: var(--text.primary);
            min-height: 100vh;
        }
        .navbar-custgom {
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 15 px 0;
        }
        .navbar-brand-custom {
            display: flex; align-items: center; gap: 12px;
            color: var(--text-primary); font-weight: 700; font-size: 18px; text-decoration: none;
        }
        .navbar-brand-custom .logo-icon {
            width: 40px; height: 40px;
            background: linear-gradient(135deg, var(--accent-primary), #8b5cf6;
            border-radius: 10px; display: align-items: center; justify-content: center;
            font-size: 20px; color: white;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent.primary), #8b5cf6);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; color: white;
        }
        .user-name { font-weight: 600; color: var(--text-primary); }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .btn-logout {
            background: rgba(239, 68, 68, 0,1); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5; padding: 8px 16px; border-radius: 8px
            font-size: 14px; transition: all 0.3s; cursor: pointer;
        }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.2); color: #fecaca; }
        .main-content {padding: 30px 0; }
        .page-header {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(217, 119, 6, 0.15));
            bordder: 1px solid rgba(245, 158, 11, 0.3);
            border-radius: 16px; padding: 30px; margin-bottom: 30px;
            animation: slideUp 0.6s ease-out
        }
        .page-header hl { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
    </style>
</head>
















    
<div class="controls-card">
    <div class="controls-row">
        <div class="control-group">
            <label><i class="bi bi-book-fill"></i> Materia</label>
            <select id="SelectMateria">
                <option value="">Selecciona una materia</option>
                <option value="Matemáticas">Matemáticas</option>
                <option value="Ciencias">Ciencias</option>
                <option value="Lenguaje">Lenguaje</option>
                <option value="Sociales">Sociales</option>
                <option value="Inglés">Inglés</option>
                <option value="Sistema Modular">Sistema Modular</option>
                <option value="MUCI">MUCI</option>
                <option value="OPV">OPV</option>
                <option value="Servicio Social">Servicio Social</option>
            </select>
        </div>
        <div class="control-group" style="flex: 0 0 auto;">
            <label>&nbsp;</label>
            <button class="btn-action btn-primary-custom" id=btnNuevaActividad" disabled>
                <i class="bi bi-plus-circle-fill"></i> Nueva Actividad
            </button>
        </div>
        <div class="control-group" style="flex: 0 0 auto;">
            <label>&nbsp;</label>
            <button class="btn-action btn-success-custom" id="btnGuardarTodo" disabled>
                <i class="bi bi-cloud-arrow-up-fill"></i> Guardar Todo
            </button>
        </div>
    </div>
</div>
<div class="periods-tab" id="periodsTabs">
    <div class="period-tab active" data-periodo="1">
        <span class="period-label">Período</span>
        <span class="period-number">1</span>
    </div>
    <div class="period-tab" data-periodo="2">
        <span class="period-label">Período</span>
        <span class="period-number">2</span>
    </div>
    <div class="period-tab" data-periodo="3">
        <span class="period-label">Período</span>
        <span class="period-number">3</span>
    </div>
    <div class="period-tab" data-periodo="4">
        <span class="period-label">Período</span>
        <span class="period-number">4</span>
    </div>
</div>
<div class="table-card">
    <div id="tablaContainer">
        <div class=empty-state">
            <i class="bi bi-journal-x"></i>
            <h4>Selecciona una materia para comenzar</h4>
            <p>Elige una materia del selector superior para gestionar las calificaciones</p>
        </div>
    </div>
    <div class="stats-bar" id="statsBar" style"display: none;">
        <div class="stat-badge total"><i class="bi bi-people-fill"></i> Total: <span id="statTotal">0</span></div>
        <div class="stat-badge aprobados"><i class="bi bi-check-circle-fill"></i> Aprobados (≥7): <span id="statAprobados">0</span></div>
        <div class="stat-badge reprobados"><i class="bi bi-x-circle-fill"></i> Reprobados (&lt7): <span id="statReprobados">0</span></div>
    </div>
  </div>
</div>
<div class="modal fade modal-custom" id="modalActividad" tabindex="-1>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="bi bi-plus-circle-fill"></i> Nueva Actividad</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label class="form-label">Nombre de la actividad</label>
                    <input type="text" class="form-control" id="inputNombreActividad" placeholder="Ej: Examen Parcial, Tarea #1, Proyecto..."</label>
                </div>
                <div class="mb-3">
                    <label class="form-label">Valor máximo (nota máxima)</label>
                    <input type="number" class="form-control" id="inputValorMaximo" value="10" min="1" max="100">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="btutton" class="btn btn-primary-custom btn-action" id="btnCrearActividad">
                    <i class="bi bi-check-circle-fill"></i> Crear Actividad
                </button>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
