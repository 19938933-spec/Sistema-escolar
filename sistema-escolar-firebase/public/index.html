<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Escolar Thomas Jefferson</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        /* Efecto de fondo sutil */
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('img/fondos/fondo-login.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.08;
            z-index: -1;
            filter: blur(3px);
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.08; }
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            z-index: 10;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { 
                opacity: 0; 
                transform: translateY(40px); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0); 
            }
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-area {
            text-align: center;
            margin-bottom: 30px;
            animation: bounceIn 1s ease-out 0.2s both;
        }

        @keyframes bounceIn {
            0% { 
                opacity: 0; 
                transform: scale(0.3); 
            }
            50% { 
                opacity: 1;
                transform: scale(1.05); 
            }
            70% { 
                transform: scale(0.9); 
            }
            100% { 
                transform: scale(1); 
            }
        }

        .logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
            animation: rotateIn 0.8s ease-out 0.4s both;
        }

        @keyframes rotateIn {
            from {
                opacity: 0;
                transform: rotate(-180deg) scale(0.5);
            }
            to {
                opacity: 1;
                transform: rotate(0) scale(1);
            }
        }

        .school-name {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
            animation: fadeInDown 0.6s ease-out 0.6s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .system-name {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            animation: fadeIn 0.6s ease-out 0.8s both;
        }

        .form-floating {
            margin-bottom: 15px;
            animation: slideInLeft 0.5s ease-out both;
        }

        .form-floating:nth-child(1) { animation-delay: 0.3s; }
        .form-floating:nth-child(2) { animation-delay: 0.4s; }
        .form-floating:nth-child(3) { animation-delay: 0.5s; }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-control {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            color: white;
            border-radius: 12px;
            padding: 16px;
            height: auto;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            color: white;
            transform: translateY(-2px);
        }

        .form-control::placeholder { color: #64748b; }
        
        .form-floating label {
            color: #64748b;
            padding-left: 16px;
            transition: all 0.3s ease;
        }

        .form-floating label i {
            transition: all 0.3s ease;
        }

        .form-control:focus + label,
        .form-control:not(:placeholder-shown) + label {
            color: var(--primary);
        }

        .form-control:focus + label i {
            color: var(--primary);
            transform: scale(1.1);
        }

        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 600;
            font-size: 1rem;
            width: 100%;
            color: white;
            transition: all 0.3s ease;
            margin-top: 10px;
            animation: pulse 2s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4);
            }
            50% {
                box-shadow: 0 0 0 10px rgba(99, 102, 241, 0);
            }
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -5px rgba(99, 102, 241, 0.5);
            animation: none;
        }

        .btn-login:active {
            transform: translateY(-1px);
        }

        .btn-login:disabled {
            opacity: 0.7;
            transform: none;
            animation: none;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .btn-login:active::before {
            width: 300px;
            height: 300px;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: var(--text-muted);
            font-size: 0.8rem;
            animation: fadeIn 0.6s ease-out 0.7s both;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }
        .divider span { padding: 0 15px; }

        .btn-google {
            border-color: var(--border);
            color: var(--text-muted);
            border-radius: 12px;
            padding: 12px;
            transition: all 0.3s ease;
            animation: slideInRight 0.5s ease-out 0.8s both;
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .btn-google:hover {
            border-color: var(--primary);
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .footer-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            animation: fadeIn 0.6s ease-out 0.9s both;
        }
        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .footer-links a:hover { 
            text-decoration: underline;
            color: var(--primary-hover);
        }

        /* Toast Notifications */
        .toast-container { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 9999; 
        }
        .custom-toast {
            background: rgba(30, 41, 59, 0.95);
            border-left: 4px solid var(--primary);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 10px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideInRight 0.4s ease, fadeOut 0.5s ease-in 3.5s forwards;
            backdrop-filter: blur(5px);
            min-width: 280px;
        }
        .custom-toast.error { border-left-color: #ef4444; }
        .custom-toast.success { border-left-color: #10b981; }
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(100%);
            }
        }

        /* Loading Screen */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }

        .loading-wave {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .loading-bar {
            width: 8px;
            height: 40px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            border-radius: 4px;
            animation: loadingWave 1s ease-in-out infinite;
        }

        .loading-bar:nth-child(2) { animation-delay: 0.1s; }
        .loading-bar:nth-child(3) { animation-delay: 0.2s; }
        .loading-bar:nth-child(4) { animation-delay: 0.3s; }

        @keyframes loadingWave {
            0%, 100% { height: 10px; }
            50% { height: 60px; }
        }

        /* Responsive */
        @media (max-width: 576px) {
            body {
                padding: 10px;
                align-items: flex-start;
                padding-top: 40px;
            }

            .login-container {
                padding: 10px;
            }

            .login-card {
                padding: 30px 20px;
            }

            .logo-img {
                width: 70px;
                height: 70px;
            }

            .school-name {
                font-size: 1rem;
            }

            .form-control {
                padding: 14px;
            }
        }

        @media (max-height: 700px) {
            body {
                align-items: flex-start;
                padding-top: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-wave">
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
        </div>
        <p style="color: var(--text-muted); margin-top: 20px; font-size: 14px; animation: fadeIn 0.5s ease-out;">
            Cargando sistema...
        </p>
    </div>

    <div class="bg-pattern"></div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <!-- LOGO INSTITUCIONAL -->
                <img src="img/fondos/logo.png" alt="Logo Escuela" class="logo-img" onerror="this.src='https://via.placeholder.com/90?text=LOGO'">
                <h1 class="school-name">Complejo Educativo<br>Thomas Jefferson</h1>
                <p class="system-name">Sistema de Gestión Académica</p>
            </div>

            <form id="loginForm">
                <!-- Usuario o Correo -->
                <div class="form-floating">
                    <input type="text" class="form-control" id="inputUser" placeholder="Usuario o Correo" required>
                    <label for="inputUser"><i class="bi bi-person-fill me-2"></i>Usuario o Correo</label>
                </div>

                <!-- Contraseña -->
                <div class="form-floating">
                    <input type="password" class="form-control" id="inputPass" placeholder="Contraseña" required>
                    <label for="inputPass"><i class="bi bi-lock-fill me-2"></i>Contraseña</label>
                </div>

                <!-- Código de Seguridad -->
                <div class="form-floating">
                    <input type="password" class="form-control" id="inputCode" placeholder="Código" required>
                    <label for="inputCode"><i class="bi bi-shield-lock-fill me-2"></i>Código de Seguridad</label>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <span id="btnText">Iniciar Sesión</span>
                    <span id="btnLoader" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span> Validando...
                    </span>
                </button>
            </form>

            <div class="divider"><span>O ACCESO RÁPIDO</span></div>

            <button class="btn btn-outline-light w-100 btn-google" onclick="alert('Próximamente: Acceso con Google para Docentes')">
                <i class="bi bi-google me-2"></i> Continuar con Google
            </button>

            <div class="footer-links">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
                <br>
                <span class="text-muted mt-2 d-inline-block">¿Eres docente? <a href="registro.html">Regístrate aquí</a></span>
            </div>
        </div>
    </div>

    <!-- Contenedor de Notificaciones -->
    <div id="toastContainer" class="toast-container"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Configuración Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyC1VnkczVVRwNDj6G1kPPdHNZXWNPy_JXA",
            authDomain: "sistema-escolar-8fcee.firebaseapp.com",
            projectId: "sistema-escolar-8fcee",
            storageBucket: "sistema-escolar-8fcee.firebasestorage.app",
            messagingSenderId: "1017912885647",
            appId: "1:1017912885647:web:ba6746d5605d281b1dcbfa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const CODIGO_SEGURIDAD = "CLASES26$COED";

        // Ocultar loading screen
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loadingScreen = document.getElementById('loadingScreen');
                loadingScreen.style.opacity = '0';
                setTimeout(() => {
                    loadingScreen.style.display = 'none';
                }, 500);
            }, 1500);
        });

        // Función para mostrar notificaciones
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = `<i class="bi bi-${type === 'error' ? 'x-circle-fill' : 'check-circle-fill'}"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const rawUser = document.getElementById('inputUser').value.trim();
            const pass = document.getElementById('inputPass').value;
            const code = document.getElementById('inputCode').value.trim();

            // 1. Validar Código de Seguridad
            if (code !== CODIGO_SEGURIDAD) {
                showToast('Código de seguridad incorrecto', 'error');
                return;
            }

            // UI Loading
            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            btn.disabled = true;
            btnText.classList.add('d-none');
            btnLoader.classList.remove('d-none');

            try {
                // 2. Lógica "Usuario o Correo"
                let email = rawUser;
                if (!rawUser.includes('@')) {
                    email = `${rawUser}@clases.edu.sv`;
                }

                // 3. Autenticar en Firebase
                const userCredential = await signInWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 4. Obtener datos de Firestore
                const userDoc = await getDoc(doc(db, 'usuarios', user.uid));
                
                if (userDoc.exists()) {
                    const data = userDoc.data();
                    
                    // Guardar sesión local
                    localStorage.setItem('usuario', JSON.stringify({
                        uid: user.uid,
                        nombre: data.nombre || data.nombreCompleto,
                        correo: data.correo,
                        rol: data.rol,
                        grado: data.gradoEncargado || data.grado || '',
                        usuario: data.usuario || rawUser
                    }));

                    showToast(`Bienvenido, ${data.nombre || data.usuario}`, 'success');

                    // Redirección según Rol
                    setTimeout(() => {
                        if (data.rol === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 1000);

                } else {
                    showToast('Error: Usuario no registrado en la base de datos', 'error');
                    btn.disabled = false;
                    btnText.classList.remove('d-none');
                    btnLoader.classList.add('d-none');
                }

            } catch (error) {
                console.error(error);
                let msg = "Error al iniciar sesión";
                if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                    msg = "Usuario o contraseña incorrectos";
                } else if (error.code === 'auth/too-many-requests') {
                    msg = "Demasiados intentos. Intenta más tarde";
                }
                showToast(msg, 'error');
                btn.disabled = false;
                btnText.classList.remove('d-none');
                btnLoader.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
