<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Escolar Thomas Jefferson</title>
    
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.85);
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --accent-primary: #6366f1;
            --accent-hover: #4f46e5;
            --border: rgba(255, 255, 255, 0.15);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-primary); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading-wave { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
        .loading-bar {
            width: 8px; height: 40px; background: linear-gradient(135deg, var(--accent-primary), #8b5cf6);
            border-radius: 4px; animation: loadingWave 1s ease-in-out infinite;
        }
        .loading-bar:nth-child(2) { animation-delay: 0.1s; }
        .loading-bar:nth-child(3) { animation-delay: 0.2s; }
        .loading-bar:nth-child(4) { animation-delay: 0.3s; }
        @keyframes loadingWave { 0%, 100% { height: 10px; } 50% { height: 60px; } }
        .login-container { width: 100%; max-width: 450px; padding: 20px; z-index: 10; }
        .login-card {
            background: var(--bg-card); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 24px; padding: 40px 35px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 15px; }
        .school-name { font-size: 1.3rem; font-weight: 700; color: var(--text-primary); }
        .system-name { font-size: 0.85rem; color: var(--text-secondary); text-transform: uppercase; }
        .form-floating { margin-bottom: 15px; }
        .form-control {
            background: rgba(15, 23, 42, 0.7); border: 2px solid var(--border);
            color: var(--text-primary); border-radius: 12px; padding: 16px;
        }
        .form-control:focus {
            background: rgba(15, 23, 42, 0.9); border-color: var(--accent-primary); color: var(--text-primary);
        }
        .form-floating label { color: var(--text-secondary); padding-left: 16px; }
        .btn-login {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-hover));
            border: none; border-radius: 12px; padding: 14px; font-weight: 600;
            width: 100%; color: white; transition: all 0.3s ease; margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); }
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: var(--text-secondary); }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border); }
        .divider span { padding: 0 15px; font-size: 0.85rem; }
        .btn-google {
            background: rgba(255, 255, 255, 0.05); border: 2px solid var(--border);
            color: var(--text-primary); border-radius: 12px; padding: 12px; width: 100%;
        }
        .footer-links { text-align: center; margin-top: 25px; font-size: 0.9rem; }
        .footer-links a { color: var(--accent-primary); text-decoration: none; font-weight: 600; }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .custom-toast {
            background: rgba(30, 41, 59, 0.95); border-left: 4px solid var(--accent-primary);
            color: var(--text-primary); padding: 15px 20px; border-radius: 8px; margin-bottom: 10px;
            display: flex; align-items: center; gap: 12px; min-width: 280px;
        }
        .custom-toast.error { border-left-color: #ef4444; }
        .custom-toast.success { border-left-color: #10b981; }
    </style>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-wave">
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
            <div class="loading-bar"></div>
        </div>
        <p>Cargando sistema...</p>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <img src="img/fondos/logo.png" alt="Logo Escuela" class="logo-img" onerror="this.src='https://via.placeholder.com/100?text=LOGO'">
                <h1 class="school-name">Complejo Educativo<br>Thomas Jefferson</h1>
                <p class="system-name">Sistema de Gestión Académica</p>
            </div>

            <form id="loginForm">
                <div class="form-floating">
                    <input type="text" class="form-control" id="inputUser" placeholder="Usuario o Correo" required autocomplete="username">
                    <label for="inputUser"><i class="bi bi-person-fill me-2"></i>Usuario o Correo</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="inputPass" placeholder="Contraseña" required autocomplete="current-password">
                    <label for="inputPass"><i class="bi bi-lock-fill me-2"></i>Contraseña</label>
                </div>

                <div class="form-floating">
                    <input type="password" class="form-control" id="inputCode" placeholder="Código" required autocomplete="off">
                    <label for="inputCode"><i class="bi bi-shield-lock-fill me-2"></i>Código de Seguridad</label>
                </div>

                <button type="submit" class="btn-login" id="btnSubmit">
                    <span id="btnText">Iniciar Sesión</span>
                    <span id="btnLoader" class="d-none">
                        <span class="spinner-border spinner-border-sm me-2"></span> Validando...
                    </span>
                </button>
            </form>

            <div class="divider"><span>O ACCESO RÁPIDO</span></div>

            <button class="btn btn-google" id="btnGoogle">
                <i class="bi bi-google me-2"></i> Continuar con Google
            </button>

            <div class="footer-links">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a><br>
                <span class="text-muted mt-2 d-inline-block">¿Eres docente? <a href="registro.html">Regístrate aquí</a></span>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <!-- Enlace al script modular -->
    <script type="module" src="js/login.js"></script>
</body>
</html>
