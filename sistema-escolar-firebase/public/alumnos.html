<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Alumnos - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.95);
            --bg-input: rgba(15, 23, 42, 0.6);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-primary: #6366f1;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-warning: #f59e0b;
            --accent-pink: #ec4899;
            --border: #334155;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, var(--bg-primary) 0%, #1a1a2e 100%); color: var(--text-primary); min-height: 100vh; }
        
        .navbar-custom { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); padding: 15px 0; }
        .navbar-brand-custom { display: flex; align-items: center; gap: 12px; color: var(--text-primary); font-weight: 700; font-size: 18px; text-decoration: none; }
        .navbar-brand-custom .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--accent-primary), #8b5cf6); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-primary), #8b5cf6); display: flex; align-items: center; justify-content: center; font-weight: 600; color: white; }
        .user-name { font-weight: 600; color: var(--text-primary); }
        .user-role { font-size: 12px; color: var(--text-secondary); }
        .btn-logout { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; padding: 8px 16px; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .btn-logout:hover { background: rgba(239, 68, 68, 0.2); color: #fecaca; }
        
        .main-content { padding: 30px 0; }
        
        .page-header { background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15)); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 16px; padding: 30px; margin-bottom: 30px; animation: slideUp 0.6s ease-out; }
        .page-header h1 { font-size: 28px; font-weight: 700; margin-bottom: 10px; }
        .page-header .subtitle { color: var(--text-secondary); font-size: 16px; }
        
        .controls-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 25px; margin-bottom: 25px; animation: slideUp 0.6s ease-out 0.1s both; }
        .control-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px; text-transform: uppercase; }
        .control-group select { width: 100%; background: var(--bg-input); border: 2px solid var(--border); border-radius: 10px; padding: 12px 15px; color: var(--text-primary); font-size: 14px; }
        .control-group select:focus { outline: none; border-color: var(--accent-primary); }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; transition: all 0.3s; position: relative; overflow: hidden; animation: slideUp 0.6s ease-out; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .stat-card::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 4px; }
        .stat-card.total::before { background: linear-gradient(90deg, var(--accent-primary), #8b5cf6); }
        .stat-card.male::before { background: linear-gradient(90deg, #3b82f6, #06b6d4); }
        .stat-card.female::before { background: linear-gradient(90deg, var(--accent-pink), #ec4899); }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; }
        .stat-card.total .stat-icon { background: rgba(99, 102, 241, 0.15); color: var(--accent-primary); }
        .stat-card.male .stat-icon { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .stat-card.female .stat-icon { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); }
        .stat-label { color: var(--text-secondary); font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .stat-value { font-size: 36px; font-weight: 700; color: var(--text-primary); }
        
        .content-grid { display: grid; grid-template-columns: 350px 1fr; gap: 30px; animation: slideUp 0.6s ease-out 0.2s both; }
        
        .form-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; height: fit-content; position: sticky; top: 20px; }
        .form-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .input-group-custom { position: relative; margin-bottom: 20px; }
        .input-group-custom i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-secondary); font-size: 18px; transition: color 0.3s; }
        .input-group-custom input, .input-group-custom select { background: var(--bg-input); border: 2px solid var(--border); border-radius: 12px; padding: 14px 15px 14px 50px; color: var(--text-primary); width: 100%; font-size: 15px; transition: all 0.3s; }
        .input-group-custom input:focus, .input-group-custom select:focus { outline: none; border-color: var(--accent-primary); background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
        .input-group-custom input:focus + i, .input-group-custom select:focus + i { color: var(--accent-primary); }
        .input-group-custom input::placeholder { color: #64748b; }
        
        .btn-submit { width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-primary), #8b5cf6); border: none; border-radius: 12px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.5); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .btn-cancel { background: var(--border); margin-top: 10px; }
        
        .list-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; padding: 25px; }
        .list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        .list-header h3 { font-size: 20px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 10px; }
        .search-box { background: var(--bg-input); border: 1px solid var(--border); border-radius: 10px; padding: 10px 15px; color: var(--text-primary); width: 250px; font-size: 14px; }
        .search-box:focus { outline: none; border-color: var(--accent-primary); }
        
        .student-list { display: flex; flex-direction: column; gap: 12px; }
        .student-item { background: rgba(15, 23, 42, 0.4); border: 1px solid var(--border); border-radius: 12px; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; transition: all 0.3s; animation: slideInRight 0.4s ease-out; }
        .student-item:hover { background: rgba(15, 23, 42, 0.6); border-color: var(--accent-primary); transform: translateX(5px); }
        .student-info { display: flex; align-items: center; gap: 15px; flex: 1; }
        .student-avatar { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 18px; color: white; }
        .student-avatar.male { background: linear-gradient(135deg, #3b82f6, #06b6d4); }
        .student-avatar.female { background: linear-gradient(135deg, var(--accent-pink), #ec4899); }
        .student-details { flex: 1; }
        .student-name { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
        .student-meta { font-size: 13px; color: var(--text-secondary); display: flex; gap: 15px; }
        .gender-badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .gender-badge.male { background: rgba(59, 130, 246, 0.15); color: #3b82f6; }
        .gender-badge.female { background: rgba(236, 72, 153, 0.15); color: var(--accent-pink); }
        .student-actions { display: flex; gap: 8px; }
        .btn-action { width: 36px; height: 36px; border-radius: 8px; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s; }
        .btn-edit { background: rgba(245, 158, 11, 0.15); color: var(--accent-warning); }
        .btn-edit:hover { background: rgba(245, 158, 11, 0.3); transform: scale(1.1); }
        .btn-delete { background: rgba(239, 68, 68, 0.15); color: var(--accent-danger); }
        .btn-delete:hover { background: rgba(239, 68, 68, 0.3); transform: scale(1.1); }
        
        .empty-state { text-align: center; padding: 60px 20px; color: var(--text-secondary); }
        .empty-state i { font-size: 64px; margin-bottom: 20px; opacity: 0.5; }
        .empty-state h4 { font-size: 20px; margin-bottom: 10px; color: var(--text-primary); }
        
        .alert-custom { padding: 12px 15px; border-radius: 10px; font-size: 14px; margin-bottom: 20px; display: none; }
        .alert-custom.show { display: block; animation: slideInRight 0.4s ease-out; }
        .alert-custom.error { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
        .alert-custom.success { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); color: #6ee7b7; }
        
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .loading-wave { display: flex; align-items: center; gap: 8px; }
        .loading-bar { width: 8px; height: 40px; background: linear-gradient(135deg, var(--accent-primary), #8b5cf6); border-radius: 4px; animation: wave 1s ease-in-out infinite; }
        .loading-bar:nth-child(2) { animation-delay: 0.1s; }
        .loading-bar:nth-child(3) { animation-delay: 0.2s; }
        .loading-bar:nth-child(4) { animation-delay: 0.3s; }
        
        @keyframes wave { 0%, 100% { height: 10px; } 50% { height: 60px; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { opacity: 0; transform: translateX(30px); } to { opacity: 1; transform: translateX(0); } }
        
        @media (max-width: 992px) {
            .content-grid { grid-template-columns: 1fr; }
            .form-card { position: static; }
            .user-name { display: none; }
        }
        @media (max-width: 768px) {
            .page-header h1 { font-size: 22px; }
            .stat-value { font-size: 28px; }
            .student-item { flex-direction: column; align-items: flex-start; gap: 15px; }
            .student-actions { width: 100%; justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-wave">
            <div class="loading-bar"></div><div class="loading-bar"></div>
            <div class="loading-bar"></div><div class="loading-bar"></div>
        </div>
    </div>

    <nav class="navbar-custom">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center">
                <a href="dashboard.html" class="navbar-brand-custom">
                    <div class="logo-icon"><i class="bi bi-mortarboard-fill"></i></div>
                    <div>
                        <div>Complejo Educativo Thomas Jefferson</div>
                        <small style="color: var(--text-secondary); font-size: 12px;">Sistema de Gestión Escolar</small>
                    </div>
                </a>
                <div class="user-info">
                    <div class="user-avatar" id="userAvatar">D</div>
                    <div>
                        <div class="user-name" id="userName">Cargando...</div>
                        <div class="user-role">Docente</div>
                    </div>
                    <button class="btn-logout" id="btnLogout"><i class="bi bi-box-arrow-right"></i> Salir</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        <div class="page-header">
            <h1><i class="bi bi-people-fill"></i> Gestión de Alumnos</h1>
            <p class="subtitle mb-0"><i class="bi bi-info-circle-fill"></i> Selecciona un grado para gestionar sus alumnos</p>
        </div>

        <div class="controls-card">
            <div class="control-group">
                <label><i class="bi bi-geo-alt-fill"></i> Seleccionar Grado/Sección</label>
                <select id="selectGrado">
                    <option value="">Cargando grados asignados...</option>
                </select>
            </div>
        </div>

        <div class="stats-grid" id="statsGrid" style="display: none;">
            <div class="stat-card total">
                <div class="stat-icon"><i class="bi bi-people-fill"></i></div>
                <div class="stat-label">Total Alumnos</div>
                <div class="stat-value" id="statTotal">0</div>
            </div>
            <div class="stat-card male">
                <div class="stat-icon"><i class="bi bi-gender-male"></i></div>
                <div class="stat-label">Varones</div>
                <div class="stat-value" id="statMale">0</div>
            </div>
            <div class="stat-card female">
                <div class="stat-icon"><i class="bi bi-gender-female"></i></div>
                <div class="stat-label">Niñas</div>
                <div class="stat-value" id="statFemale">0</div>
            </div>
        </div>

        <div class="content-grid" id="contentGrid" style="display: none;">
            <div class="form-card">
                <h3><i class="bi bi-person-plus-fill"></i> <span id="formTitle">Registrar Alumno</span></h3>
                <div id="alerta" class="alert-custom"></div>
                <form id="formAlumno">
                    <input type="hidden" id="alumnoId">
                    <div class="input-group-custom">
                        <input type="text" id="nombreAlumno" placeholder="Nombre completo del alumno" required>
                        <i class="bi bi-person-fill"></i>
                    </div>
                    <div class="input-group-custom">
                        <select id="generoAlumno" required>
                            <option value="" disabled selected>Selecciona el género</option>
                            <option value="Masculino">Masculino</option>
                            <option value="Femenino">Femenino</option>
                        </select>
                        <i class="bi bi-gender-ambiguous"></i>
                    </div>
                    <div class="input-group-custom">
                        <input type="text" id="gradoAlumno" readonly>
                        <i class="bi bi-book-fill"></i>
                    </div>
                    <button type="submit" class="btn-submit" id="btnSubmit">
                        <i class="bi bi-plus-circle-fill"></i>
                        <span id="btnText">Registrar Alumno</span>
                    </button>
                    <button type="button" class="btn-submit btn-cancel" id="btnCancel" style="display: none;">
                        <i class="bi bi-x-circle-fill"></i> Cancelar Edición
                    </button>
                </form>
            </div>

            <div class="list-card">
                <div class="list-header">
                    <h3><i class="bi bi-list-ul"></i> Lista de Alumnos</h3>
                    <input type="text" class="search-box" id="searchBox" placeholder="🔍 Buscar por nombre...">
                </div>
                <div class="student-list" id="studentList">
                    <div class="empty-state"><i class="bi bi-inbox"></i><h4>Selecciona un grado para ver los alumnos</h4></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, query, where, onSnapshot, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1VnkczVVRwNDj6G1kPPdHNZXWNPy_JXA",
            authDomain: "sistema-escolar-8fcee.firebaseapp.com",
            projectId: "sistema-escolar-8fcee",
            storageBucket: "sistema-escolar-8fcee.firebasestorage.app",
            messagingSenderId: "1017912885647",
            appId: "1:1017912885647:web:ba6746d5605d281b1dcbfa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let usuarioActual = null;
        let alumnos = [];
        let editandoId = null;
        let gradoSeleccionado = '';
        let unsubscribeAlumnos = null;

        const form = document.getElementById('formAlumno');
        const alerta = document.getElementById('alerta');
        const studentList = document.getElementById('studentList');
        const searchBox = document.getElementById('searchBox');
        const btnCancel = document.getElementById('btnCancel');
        const formTitle = document.getElementById('formTitle');
        const btnText = document.getElementById('btnText');

        function mostrarAlerta(mensaje, tipo) {
            alerta.textContent = mensaje;
            alerta.className = `alert-custom ${tipo} show`;
            setTimeout(() => alerta.classList.remove('show'), 4000);
        }

        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }

            try {
                const userDoc = await getDoc(doc(db, 'usuarios', user.uid));
                if (!userDoc.exists()) { window.location.href = 'index.html'; return; }
                
                const data = userDoc.data();
                if (data.rol !== 'docente') { window.location.href = 'admin.html'; return; }

                usuarioActual = {
                    uid: user.uid,
                    nombre: data.nombre || data.nombreCompleto,
                    correo: data.correo,
                    rol: data.rol,
                    grado: data.gradoEncargado || '',
                    usuario: data.usuario,
                    materiasImpartidas: data.materiasImpartidas || []
                };
                localStorage.setItem('usuario', JSON.stringify(usuarioActual));

                document.getElementById('userName').textContent = usuarioActual.nombre;
                document.getElementById('userAvatar').textContent = usuarioActual.nombre.charAt(0).toUpperCase();

                llenarSelectorGrados();

                setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 800);
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar datos', 'error');
            }
        });

        function obtenerGradosAsignados() {
            const grados = new Set();
            if (usuarioActual.grado) grados.add(usuarioActual.grado);
            (usuarioActual.materiasImpartidas || []).forEach(m => {
                (m.grados || []).forEach(g => grados.add(g));
            });
            return Array.from(grados).sort();
        }

        function llenarSelectorGrados() {
            const select = document.getElementById('selectGrado');
            const grados = obtenerGradosAsignados();
            
            select.innerHTML = '<option value="">-- Selecciona un grado --</option>';
            
            if (grados.length === 0) {
                select.innerHTML = '<option value="">No tienes grados asignados. Configura tu perfil.</option>';
                return;
            }

            grados.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                const esTutor = g === usuarioActual.grado;
                opt.textContent = esTutor ? `⭐ ${g} (Tutor)` : g;
                select.appendChild(opt);
            });
        }

        document.getElementById('selectGrado').addEventListener('change', (e) => {
            gradoSeleccionado = e.target.value;
            
            if (unsubscribeAlumnos) unsubscribeAlumnos();
            
            if (!gradoSeleccionado) {
                document.getElementById('statsGrid').style.display = 'none';
                document.getElementById('contentGrid').style.display = 'none';
                return;
            }

            document.getElementById('gradoAlumno').value = gradoSeleccionado;
            document.getElementById('statsGrid').style.display = 'grid';
            document.getElementById('contentGrid').style.display = 'grid';
            
            cargarAlumnosTiempoReal();
        });

        function cargarAlumnosTiempoReal() {
            const q = query(collection(db, 'alumnos'), where('grado', '==', gradoSeleccionado));
            
            unsubscribeAlumnos = onSnapshot(q, (snapshot) => {
                alumnos = [];
                snapshot.forEach(doc => alumnos.push({ id: doc.id, ...doc.data() }));
                alumnos.sort((a, b) => a.nombre.localeCompare(b.nombre));
                
                actualizarEstadisticas();
                renderizarLista(alumnos);
            }, (error) => {
                console.error('Error:', error);
                mostrarAlerta('Error al cargar alumnos', 'error');
            });
        }

        function actualizarEstadisticas() {
            const total = alumnos.length;
            const male = alumnos.filter(a => a.genero === 'Masculino').length;
            const female = alumnos.filter(a => a.genero === 'Femenino').length;
            animarContador('statTotal', total);
            animarContador('statMale', male);
            animarContador('statFemale', female);
        }

        function animarContador(elementId, target) {
            const element = document.getElementById(elementId);
            let current = parseInt(element.textContent) || 0;
            if (current === target) return;
            const increment = (target - current) / 20;
            const timer = setInterval(() => {
                current += increment;
                if ((increment > 0 && current >= target) || (increment < 0 && current <= target)) {
                    current = target;
                    clearInterval(timer);
                }
                element.textContent = Math.floor(current);
            }, 30);
        }

        function renderizarLista(lista) {
            if (lista.length === 0) {
                studentList.innerHTML = '<div class="empty-state"><i class="bi bi-inbox"></i><h4>No hay alumnos registrados en este grado</h4><p>Comienza agregando el primer estudiante</p></div>';
                return;
            }
            studentList.innerHTML = lista.map((alumno, index) => `
                <div class="student-item" style="animation-delay: ${index * 0.05}s">
                    <div class="student-info">
                        <div class="student-avatar ${alumno.genero === 'Masculino' ? 'male' : 'female'}">
                            ${alumno.nombre.charAt(0).toUpperCase()}
                        </div>
                        <div class="student-details">
                            <div class="student-name">${alumno.nombre}</div>
                            <div class="student-meta">
                                <span class="gender-badge ${alumno.genero === 'Masculino' ? 'male' : 'female'}">
                                    <i class="bi bi-${alumno.genero === 'Masculino' ? 'gender-male' : 'gender-female'}"></i>
                                    ${alumno.genero}
                                </span>
                                <span><i class="bi bi-book"></i> ${alumno.grado}</span>
                            </div>
                        </div>
                    </div>
                    <div class="student-actions">
                        <button class="btn-action btn-edit" onclick="editarAlumno('${alumno.id}')" title="Editar">
                            <i class="bi bi-pencil-fill"></i>
                        </button>
                        <button class="btn-action btn-delete" onclick="eliminarAlumno('${alumno.id}', '${alumno.nombre.replace(/'/g, "\\'")}')" title="Eliminar">
                            <i class="bi bi-trash-fill"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombreAlumno').value.trim();
            const genero = document.getElementById('generoAlumno').value;
            const grado = document.getElementById('gradoAlumno').value;

            if (!nombre || !genero || !grado) { mostrarAlerta(' Completa todos los campos', 'error'); return; }

            const btnSubmit = document.getElementById('btnSubmit');
            btnSubmit.disabled = true;

            try {
                if (editandoId) {
                    await updateDoc(doc(db, 'alumnos', editandoId), {
                        nombre, genero, grado,
                        fechaActualizacion: new Date().toISOString()
                    });
                    mostrarAlerta('✅ Alumno actualizado', 'success');
                    cancelarEdicion();
                } else {
                    await addDoc(collection(db, 'alumnos'), {
                        nombre, genero, grado,
                        docenteId: usuarioActual.uid,
                        fechaRegistro: new Date().toISOString()
                    });
                    mostrarAlerta('✅ Alumno registrado', 'success');
                    form.reset();
                    document.getElementById('gradoAlumno').value = grado;
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('❌ Error: ' + error.message, 'error');
            }
            btnSubmit.disabled = false;
        });

        window.editarAlumno = (id) => {
            const alumno = alumnos.find(a => a.id === id);
            if (!alumno) return;
            editandoId = id;
            document.getElementById('nombreAlumno').value = alumno.nombre;
            document.getElementById('generoAlumno').value = alumno.genero;
            document.getElementById('gradoAlumno').value = alumno.grado;
            formTitle.textContent = 'Editar Alumno';
            btnText.textContent = 'Actualizar Alumno';
            btnCancel.style.display = 'flex';
            if (window.innerWidth <= 992) document.querySelector('.form-card').scrollIntoView({ behavior: 'smooth' });
        };

        function cancelarEdicion() {
            editandoId = null;
            form.reset();
            document.getElementById('gradoAlumno').value = gradoSeleccionado;
            formTitle.textContent = 'Registrar Alumno';
            btnText.textContent = 'Registrar Alumno';
            btnCancel.style.display = 'none';
        }

        btnCancel.addEventListener('click', cancelarEdicion);

        window.eliminarAlumno = async (id, nombre) => {
            if (!confirm(`¿Eliminar a "${nombre}"?\nEsta acción no se puede deshacer.`)) return;
            try {
                await deleteDoc(doc(db, 'alumnos', id));
                mostrarAlerta('🗑️ Alumno eliminado', 'success');
            } catch (error) {
                console.error('Error:', error);
                mostrarAlerta('❌ Error al eliminar', 'error');
            }
        };

        searchBox.addEventListener('input', (e) => {
            const q = e.target.value.toLowerCase();
            const filtrados = alumnos.filter(a => a.nombre.toLowerCase().includes(q));
            renderizarLista(filtrados);
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            if (confirm('¿Cerrar sesión?')) {
                await signOut(auth);
                localStorage.removeItem('usuario');
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
