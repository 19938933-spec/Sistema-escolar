<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Docente - Sistema Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Mismos estilos del index.html para consistencia */
        :root {
            --bg-primary: #0f172a; --bg-card: rgba(30, 41, 59, 0.85);
            --text-primary: #f1f5f9; --text-secondary: #cbd5e1;
            --accent-primary: #6366f1; --border: rgba(255, 255, 255, 0.15);
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-container { width: 100%; max-width: 500px; animation: slideUp 0.8s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        .register-card { background: var(--bg-card); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 24px; padding: 40px 35px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); }
        .register-header { text-align: center; margin-bottom: 30px; }
        .register-header h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 5px; }
        .register-header p { color: var(--text-secondary); font-size: 0.9rem; }
        .form-control { background: rgba(15, 23, 42, 0.7); border: 2px solid var(--border); color: var(--text-primary); border-radius: 12px; padding: 12px 15px; margin-bottom: 15px; transition: all 0.3s; }
        .form-control:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2); background: rgba(15, 23, 42, 0.9); color: white; }
        .form-control::placeholder { color: #94a3b8; }
        .btn-register { background: linear-gradient(135deg, var(--accent-primary), #4f46e5); border: none; border-radius: 12px; padding: 14px; font-weight: 600; width: 100%; color: white; transition: all 0.3s; }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(99, 102, 241, 0.4); }
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; }
        .custom-toast { background: rgba(30, 41, 59, 0.95); border-left: 4px solid var(--accent-primary); color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 10px; animation: slideIn 0.4s ease; }
        .custom-toast.error { border-left-color: #ef4444; } .custom-toast.success { border-left-color: #10b981; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(100%); } to { opacity: 1; transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <img src="img/fondos/logo.png" alt="Logo" style="width: 60px; height: 60px; object-fit: contain; margin-bottom: 15px;" onerror="this.src='https://via.placeholder.com/60?text=LOGO'">
                <h2>Registro de Docente</h2>
                <p>Complejo Educativo Thomas Jefferson</p>
            </div>

            <form id="formRegistro">
                <div class="row">
                    <div class="col-6">
                        <input type="text" class="form-control" id="nombres" placeholder="Nombres" required>
                    </div>
                    <div class="col-6">
                        <input type="text" class="form-control" id="apellidos" placeholder="Apellidos" required>
                    </div>
                </div>
                
                <input type="text" class="form-control" id="usuario" placeholder="Nombre de usuario (ej: cJulian13)" required style="text-transform: lowercase;">
                <input type="email" class="form-control" id="correo" placeholder="Correo institucional (@clases.edu.sv)" required>
                
                <div class="row">
                    <div class="col-6">
                        <input type="password" class="form-control" id="contrasena" placeholder="Contraseña" required minlength="6">
                    </div>
                    <div class="col-6">
                        <input type="password" class="form-control" id="confirmarContrasena" placeholder="Confirmar Contraseña" required>
                    </div>
                </div>

                <input type="text" class="form-control" id="codigoSeguridad" placeholder="Código de Seguridad" required>

                <button type="submit" class="btn-register" id="btnSubmit">
                    <span id="btnText">Crear Cuenta</span>
                    <span id="btnLoader" class="d-none"><span class="spinner-border spinner-border-sm me-2"></span>Procesando...</span>
                </button>
            </form>

            <div class="text-center mt-4">
                <a href="index.html" style="color: var(--accent-primary); text-decoration: none; font-weight: 500;">¿Ya tienes cuenta? Inicia sesión</a>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC1VnkczVVRwNDj6G1kPPdHNZXWNPy_JXA",
            authDomain: "sistema-escolar-8fcee.firebaseapp.com",
            projectId: "sistema-escolar-8fcee",
            storageBucket: "sistema-escolar-8fcee.firebasestorage.app",
            messagingSenderId: "1017912885647",
            appId: "1:1017912885647:web:ba6746d5605d281b1dcbfa"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast ${type}`;
            toast.innerHTML = `<i class="bi bi-${type === 'error' ? 'x-circle-fill' : 'check-circle-fill'} me-2"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 4000);
        }

        document.getElementById('formRegistro').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nombres = document.getElementById('nombres').value.trim();
            const apellidos = document.getElementById('apellidos').value.trim();
            const usuario = document.getElementById('usuario').value.trim().toLowerCase();
            const correo = document.getElementById('correo').value.trim();
            const contrasena = document.getElementById('contrasena').value;
            const confirmarContrasena = document.getElementById('confirmarContrasena').value;
            const codigo = document.getElementById('codigoSeguridad').value.trim();

            if (codigo !== "CLASES26$COED") { showToast('Código de seguridad incorrecto', 'error'); return; }
            if (!correo.endsWith('@clases.edu.sv')) { showToast('El correo debe terminar en @clases.edu.sv', 'error'); return; }
            if (contrasena !== confirmarContrasena) { showToast('Las contraseñas no coinciden', 'error'); return; }

            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            btn.disabled = true; btnText.classList.add('d-none'); btnLoader.classList.remove('d-none');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, correo, contrasena);
                const user = userCredential.user;

                await setDoc(doc(db, 'usuarios', user.uid), {
                    uid: user.uid,
                    nombres: nombres,
                    apellidos: apellidos,
                    nombreCompleto: `${nombres} ${apellidos}`,
                    usuario: usuario,
                    correo: correo,
                    rol: 'docente',
                    perfilConfigurado: false, // Importante: false hasta que configure sus materias
                    gradoEncargado: null,
                    materiasImpartidas: [],
                    fechaRegistro: new Date().toISOString()
                });

                showToast('¡Cuenta creada exitosamente! Ahora configura tu perfil.', 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);

            } catch (error) {
                console.error(error);
                let msg = "Error al crear la cuenta";
                if (error.code === 'auth/email-already-in-use') msg = "Ese correo ya está registrado";
                else if (error.code === 'auth/weak-password') msg = "La contraseña es muy débil (mínimo 6 caracteres)";
                showToast(msg, 'error');
                
                btn.disabled = false; btnText.classList.remove('d-none'); btnLoader.classList.add('d-none');
            }
        });
    </script>
</body>
</html>
