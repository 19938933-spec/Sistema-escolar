<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Asistente Edu.Control</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root {
  --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8;
  --accent:#6366f1; --accent2:#818cf8; --ok:#10b981; --border:#334155;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:linear-gradient(145deg,#0f172a,#1a1a2e);color:var(--text);min-height:100vh}
/* LOADER */
#loader{
  position:fixed;inset:0;z-index:9999;background:#0f172a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  transition:opacity .45s ease, visibility .45s;
}
#loader.hide{opacity:0;visibility:hidden;pointer-events:none}
#loader img{width:88px;height:88px;object-fit:contain;border-radius:50%;animation:pulse 1.4s ease-in-out infinite}
#loader .bar{width:160px;height:4px;background:#1e293b;border-radius:4px;overflow:hidden}
#loader .bar span{display:block;height:100%;width:40%;background:linear-gradient(90deg,#6366f1,#818cf8);border-radius:4px;animation:load 1.1s ease-in-out infinite}
#loader p{color:#94a3b8;font-size:.9rem}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
.topbar{
  background:rgba(30,41,59,.98);border-bottom:1px solid var(--border);
  padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700}
.brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#fff}
.btn-soft{
  background:rgba(99,102,241,.15);border:1px solid rgba(99,102,241,.35);color:#c7d2fe;
  font-size:.84rem;padding:6px 12px;border-radius:8px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer
}
.btn-soft:hover{background:rgba(99,102,241,.28);color:#fff}
.layout{display:grid;grid-template-columns:1fr;max-width:1100px;margin:0 auto;padding:12px;gap:12px}
@media(min-width:900px){.layout{grid-template-columns:250px 1fr}}
.side,.chat-shell{background:rgba(30,41,59,.95);border:1px solid var(--border);border-radius:14px}
.side{padding:14px;height:fit-content}
.side h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:10px}
.quick{display:flex;flex-direction:column;gap:6px}
.quick button{
  text-align:left;background:rgba(15,23,42,.65);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 12px;font-size:.84rem;cursor:pointer
}
.quick button:hover{border-color:var(--accent);background:rgba(99,102,241,.12)}
.chat-shell{display:flex;flex-direction:column;min-height:72vh;max-height:calc(100vh - 90px);overflow:hidden}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.chat-head .meta{font-size:.78rem;color:var(--muted)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:10px 14px;border-radius:14px;font-size:.92rem;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.msg.bot{align-self:flex-start;background:rgba(15,23,42,.9);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#4f46e5,#6366f1);border-bottom-right-radius:4px}
.msg .actions{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.msg .actions button,.msg .actions a{
  font-size:.78rem;padding:5px 10px;border-radius:8px;border:1px solid rgba(129,140,248,.5);
  background:rgba(99,102,241,.2);color:#c7d2fe;cursor:pointer;text-decoration:none
}
.typing-row{align-self:flex-start;display:none;align-items:center;gap:8px;padding:8px 0}
.typing-row.show{display:flex}
.typing-bubble{
  display:inline-flex;gap:5px;align-items:center;padding:12px 16px;
  background:rgba(15,23,42,.9);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px
}
.typing-bubble i{width:7px;height:7px;border-radius:50%;background:#94a3b8;display:block;animation:ty 1.2s infinite ease-in-out}
.typing-bubble i:nth-child(2){animation-delay:.15s}
.typing-bubble i:nth-child(3){animation-delay:.3s}
@keyframes ty{0%,80%,100%{transform:translateY(0);opacity:.35}40%{transform:translateY(-5px);opacity:1}}
.composer{border-top:1px solid var(--border);padding:12px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{
  flex:1;resize:none;border-radius:12px;border:1px solid var(--border);background:rgba(15,23,42,.75);
  color:var(--text);padding:10px 12px;font-size:.92rem;min-height:46px;max-height:120px;font-family:inherit
}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.composer .send{
  background:var(--accent);border:none;color:#fff;width:46px;height:46px;border-radius:12px;font-size:1.1rem;cursor:pointer
}
.composer .send:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:.72rem;color:var(--muted);padding:0 16px 8px}
</style>
</head>

Login: abrir el sitio → correo y contraseña (o Google si está autorizado) → en el primer acceso completar grado/sección y materias.
Docente: gestionar alumnos del grado, pasar asistencia por fecha, registrar notas por materia y periodo, cerrar/reabrir periodos, descargar PDF.
Admin: activar/desactivar cuentas, reportes globales, PDF de notas por grado y periodo.

Tips: usar nombres oficiales de grados (ej. 2° ITSI A); guardar asistencia del día; cerrar sesión en PCs compartidas; si no ves alumnos, revisa el perfil.

Si el usuario pide abrir una pantalla, responde en español y al FINAL del mensaje escribe exactamente uno de estos marcadores (sin texto después):
[[NAV:index.html]]
[[NAV:dashboard.html]]
[[NAV:alumnos.html]]
[[NAV:asistencia.html]]
[[NAV:calificaciones.html]]
[[NAV:admin.html]]
[[NAV:configurar-perfil.html]]`;

  {keys:["tip","consejo","recomienda","buena practica"],
   answer:"Tips rápidos:\n• Usa nombres oficiales de grados (ej. 2° ITSI A).\n• Guarda la asistencia el mismo día.\n• Cierra el periodo de notas al terminar el ciclo.\n• Cierra sesión en equipos compartidos.\n• Si no ves alumnos, revisa tu perfil."},
  {keys:["abrir login","abre login","pantalla de login","pagina de login"], answer:"Te abro la pantalla de login.", nav:"index.html"},
  {keys:["abrir panel","abre panel","pantalla principal","dashboard","panel principal"], answer:"Te abro el panel principal. Si no has iniciado sesión, el sistema te pedirá entrar.", nav:"dashboard.html"},

const messagesEl = document.getElementById("messages");
const inputEl = document.getElementById("input");
const btnSend = document.getElementById("btnSend");
const typingRow = document.getElementById("typingRow");
const history = []; // {role:'user'|'model', text:string}

function norm(s){ return (s||"").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu,""); }

function addMsg(text, who, navUrl){
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = String(text||"").replace(/\[\[NAV:[^\]]+\]\]/g,"").trim();
  if(navUrl){
    const actions = document.createElement("div");
    actions.className = "actions";
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = "Ir ahora";
    b.onclick = ()=>{ window.location.href = navUrl; };
    actions.appendChild(b);
    div.appendChild(actions);
  }
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setTyping(on){
  typingRow.classList.toggle("show", !!on);
  if(on){
    messagesEl.appendChild(typingRow);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }
}

function localAnswer(q){
  const t = norm(q);
  for(const item of FAQ){
    if(item.keys.some(k => t.includes(norm(k)))) return item;
  }
  // si es muy corto / saludo residual
  if(t.length < 12) {
    return {answer:"¡Hola! Dime qué necesitas de Edu.Control: login, asistencia, notas, alumnos, admin o abrir una pantalla."};
  }
  return {answer:"Puedo ayudarte con login, asistencia, calificaciones, alumnos, roles, tips y abrir pantallas del sistema.\n¿Qué necesitas?"};
}

function extractNav(text){
  const m = String(text).match(/\[\[NAV:([^\]]+)\]\]/);
  return m ? m[1].trim() : null;
}

function detectNavIntent(q){
  const t = norm(q);
  const wants = /abr|ir a|lleva|abre|pantalla|pesta/.test(t);
  if(wants && /login|iniciar sesion|entrar/.test(t)) return "index.html";
  if(wants && /dashboard|panel principal|pantalla principal/.test(t)) return "dashboard.html";
  if(wants && /asistencia/.test(t)) return "asistencia.html";
  if(wants && /(calific|notas)/.test(t)) return "calificaciones.html";
  if(wants && /alumnos/.test(t)) return "alumnos.html";
  if(wants && /admin/.test(t)) return "admin.html";
  if(wants && /(perfil|configurar)/.test(t)) return "configurar-perfil.html";
  return null;
}

async function callModel(model, contents){
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(GEMINI_API_KEY)}`;
  const body = {
    system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
    contents,
    generationConfig: { temperature: 0.5, maxOutputTokens: 700 }
  };
  const res = await fetch(url, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body)
  });
  const raw = await res.text();
  let data;
  try { data = JSON.parse(raw); } catch { data = {}; }
  if(!res.ok){
    // reintento sin system_instruction (algunas keys/modelos fallan con ese campo)
    const body2 = {
      contents: [
        { role: "user", parts: [{ text: SYSTEM_PROMPT + "\n\n---\nConversación:\n" + contents.map(c => (c.role==="user"?"Usuario: ":"Asistente: ")+(c.parts[0].text||"")).join("\n") }] }
      ],
      generationConfig: { temperature: 0.5, maxOutputTokens: 700 }
    };
    const res2 = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body2)
    });
    const raw2 = await res2.text();
    let data2; try { data2 = JSON.parse(raw2); } catch { data2 = {}; }
    if(!res2.ok) throw new Error((data.error && data.error.message) || (data2.error && data2.error.message) || ("HTTP "+res.status));
    data = data2;
  }
  const text = (data?.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("").trim();
  if(!text) throw new Error("Respuesta vacía");
  return text;
}

async function askGemini(userText){
  if(!GEMINI_API_KEY || GEMINI_API_KEY.includes("PEGA_AQUI")) throw new Error("Sin API key");

  const contents = [];
  // historial reciente (últimos 8 turnos)
  const slice = history.slice(-8);
  for(const h of slice){
    contents.push({ role: h.role === "user" ? "user" : "model", parts: [{ text: h.text }] });
  }
  contents.push({ role: "user", parts: [{ text: userText }] });

  let lastErr;
  for(const model of GEMINI_MODELS){
    try {
      return await callModel(model, contents);
    } catch(e) {
      lastErr = e;
      console.warn("Modelo falló:", model, e.message);
    }
  }
  throw lastErr || new Error("No se pudo contactar la IA");
}

async function handleSend(text){
  const q = (text || "").trim();
  if(!q) return;
  addMsg(q, "user");
  inputEl.value = "";
  btnSend.disabled = true;
  setTyping(true);

  let reply = "";
  let nav = detectNavIntent(q);
  try {
    reply = await askGemini(q);
    history.push({ role: "user", text: q });
    history.push({ role: "model", text: reply });
    const n = extractNav(reply);
    if(n) nav = n;
  } catch (e) {
    console.warn("Fallback local:", e.message);
    const local = localAnswer(q);
    reply = local.answer;
    if(local.nav) nav = local.nav;
    history.push({ role: "user", text: q });
    history.push({ role: "model", text: reply });
  }

  await new Promise(r => setTimeout(r, 280));
  setTyping(false);
  addMsg(reply, "bot", nav);
  btnSend.disabled = false;
  inputEl.focus();
}

function generarManualPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const margin = 48;
  let y = margin;
  const line = (t, size=11, bold=false) => {
    doc.setFont("times", bold ? "bold" : "normal");
    doc.setFontSize(size);
    const lines = doc.splitTextToSize(t, 612 - margin * 2);
    lines.forEach(l => {
      if(y > 740){ doc.addPage(); y = margin; }
      doc.text(l, margin, y);
      y += size + 4;
    });
    y += 6;
  };
  line("Complejo Educativo Thomas Jefferson", 14, true);
  line("Manual de uso — Edu.Control", 13, true);
  line("Sistema Integral de Gestión Académica", 11);
  y += 4;
  line("1. ¿Qué es Edu.Control?", 12, true);
  line("Aplicación web para digitalizar asistencia, calificaciones, alumnos y periodos escolares. Se usa desde el navegador con datos en la nube (Firebase).");
  line("2. Cómo iniciar sesión", 12, true);
  line("Abre la URL del sistema, ingresa correo y contraseña (o Google si está autorizado). En el primer acceso completa grado/sección y materias.");
  line("3. Panel docente", 12, true);
  line("Alumnos: registrar y editar. Asistencia: marcar por fecha y guardar. Calificaciones: notas por materia y periodo. Puedes cerrar periodos y descargar PDF.");
  line("4. Panel administrador", 12, true);
  line("Activar o desactivar cuentas, reportes globales y PDF de notas por grado y periodo.");
  line("5. Buenas prácticas", 12, true);
  line("Usar nombres oficiales de grados (ej. 2° ITSI A). Guardar asistencia del día. Cerrar sesión en equipos compartidos.");
  line("6. Soporte", 12, true);
  line("Si no ves alumnos, revisa tu perfil. Si no guarda, revisa internet. Si no descarga PDF, permite ventanas emergentes.");
  y += 8;
  line("Documento de uso interno · ITSI · Grupo 4 · 2026", 9);
  doc.save("Manual_EduControl.pdf");
}

});
document.querySelectorAll(".quick button").forEach(btn => {

});
document.getElementById("btnPdf").addEventListener("click", generarManualPDF);
